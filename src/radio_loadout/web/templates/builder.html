<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Build a custom multi-channel radio loadout and export it for CHIRP."
    >

    <title>Channel Builder | Radio Loadout</title>

    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/builder.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-mark">RL</span>
            <span>Radio Loadout</span>
        </a>

        <span class="version">Early Development</span>
    </header>

    <main>
        <section class="builder-heading">
            <p class="eyebrow">Multi-channel builder</p>
            <h1>Build your radio loadout.</h1>

            <p class="hero-description">
                Add as many channels as you need, arrange their radio
                settings, and export the complete loadout as one
                CHIRP-compatible CSV file.
            </p>
        </section>

        <form
            id="channel-form"
            class="builder-form"
            action="/downloads/chirp.csv"
            method="post"
        >
            <input
                id="channels-json"
                name="channels_json"
                type="hidden"
            >

            <div id="channel-list" class="channel-list"></div>

            <div class="builder-actions">
                <button
                    id="add-channel"
                    class="button button-secondary"
                    type="button"
                >
                    + Add another channel
                </button>

                <button
                    class="button button-primary"
                    type="submit"
                >
                    Generate CHIRP CSV
                </button>
            </div>
        </form>

        <template id="channel-template">
            <article class="channel-card" data-channel-card>
                <div class="channel-card-header">
                    <h2 data-channel-number>Channel</h2>

                    <button
                        class="remove-channel"
                        type="button"
                        data-remove-channel
                    >
                        Remove
                    </button>
                </div>

                <div class="form-grid">
                    <label class="form-field">
                        <span>Channel name</span>
                        <input
                            data-field="name"
                            type="text"
                            maxlength="32"
                            placeholder="Example: TEST RPT"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Mode</span>
                        <select data-field="mode">
                            <option value="FM">FM</option>
                            <option value="NFM">NFM</option>
                            <option value="AM">AM</option>
                        </select>
                    </label>

                    <label class="form-field">
                        <span>Receive frequency (MHz)</span>
                        <input
                            data-field="receive_frequency_mhz"
                            type="number"
                            min="0.000001"
                            step="0.000001"
                            placeholder="146.940000"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Transmit frequency (MHz)</span>
                        <input
                            data-field="transmit_frequency_mhz"
                            type="number"
                            min="0.000001"
                            step="0.000001"
                            placeholder="146.340000"
                        >
                    </label>

                    <label class="form-field">
                        <span>Power (watts)</span>
                        <input
                            data-field="power_watts"
                            type="number"
                            min="0.1"
                            step="0.1"
                            value="5.0"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Tone mode</span>
                        <select data-field="tone_mode">
                            <option value="none">
                                No tone
                            </option>
                            <option value="tone">
                                Transmit tone
                            </option>
                            <option value="tsql">
                                Tone squelch
                            </option>
                        </select>
                    </label>

                    <label class="form-field">
    <span>CTCSS frequency (Hz)</span>
    <select
        data-field="tone_frequency_hz"
        disabled
    >
        <option value="">Select a tone</option>
        <option value="67.0">67.0</option>
        <option value="69.3">69.3</option>
        <option value="71.9">71.9</option>
        <option value="74.4">74.4</option>
        <option value="77.0">77.0</option>
        <option value="79.7">79.7</option>
        <option value="82.5">82.5</option>
        <option value="85.4">85.4</option>
        <option value="88.5">88.5</option>
        <option value="91.5">91.5</option>
        <option value="94.8">94.8</option>
        <option value="97.4">97.4</option>
        <option value="100.0">100.0</option>
        <option value="103.5">103.5</option>
        <option value="107.2">107.2</option>
        <option value="110.9">110.9</option>
        <option value="114.8">114.8</option>
        <option value="118.8">118.8</option>
        <option value="123.0">123.0</option>
        <option value="127.3">127.3</option>
        <option value="131.8">131.8</option>
        <option value="136.5">136.5</option>
        <option value="141.3">141.3</option>
        <option value="146.2">146.2</option>
        <option value="151.4">151.4</option>
        <option value="156.7">156.7</option>
        <option value="159.8">159.8</option>
        <option value="162.2">162.2</option>
        <option value="165.5">165.5</option>
        <option value="167.9">167.9</option>
        <option value="171.3">171.3</option>
        <option value="173.8">173.8</option>
        <option value="177.3">177.3</option>
        <option value="179.9">179.9</option>
        <option value="183.5">183.5</option>
        <option value="186.2">186.2</option>
        <option value="189.9">189.9</option>
        <option value="192.8">192.8</option>
        <option value="196.6">196.6</option>
        <option value="199.5">199.5</option>
        <option value="203.5">203.5</option>
        <option value="206.5">206.5</option>
        <option value="210.7">210.7</option>
        <option value="218.1">218.1</option>
        <option value="225.7">225.7</option>
        <option value="229.1">229.1</option>
        <option value="233.6">233.6</option>
        <option value="241.8">241.8</option>
        <option value="250.3">250.3</option>
        <option value="254.1">254.1</option>
    </select>
</label>

                    <label class="form-field form-field-wide">
                        <span>Comment</span>
                        <input
                            data-field="comment"
                            type="text"
                            maxlength="120"
                            placeholder="Optional description"
                        >
                    </label>

                    <label class="checkbox-field form-field-wide">
                        <input
                            data-field="receive_only"
                            type="checkbox"
                        >
                        <span>
                            Receive only — disable transmitting on
                            this channel
                        </span>
                    </label>
                </div>
            </article>
        </template>
    </main>
</body>
</html>
