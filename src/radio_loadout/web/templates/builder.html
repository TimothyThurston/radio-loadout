<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Build a custom radio loadout and export it for CHIRP."
    >

    <title>Channel Builder | Radio Loadout</title>

    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/builder.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-mark">RL</span>
            <span>Radio Loadout</span>
        </a>

        <span class="version">Early Development</span>
    </header>

    <main>
        <section class="builder-heading">
            <p class="eyebrow">Multi-channel builder</p>
            <h1>Build your radio loadout.</h1>

            <p class="hero-description">
                Add as many channels as you need, configure their radio
                settings, and export the complete loadout as one
                CHIRP-compatible CSV file.
            </p>
        </section>

        <form
            id="channel-form"
            class="builder-form"
            action="/downloads/chirp.csv"
            method="post"
        >
            <input
                id="channels-json"
                name="channels_json"
                type="hidden"
            >

            <div id="channel-list" class="channel-list"></div>

            <div class="builder-actions">
                <button
                    id="add-channel"
                    class="button button-secondary"
                    type="button"
                >
                    + Add another channel
                </button>

                <button
                    class="button button-primary"
                    type="submit"
                >
                    Generate CHIRP CSV
                </button>
            </div>
        </form>

        <template id="channel-template">
            <article class="channel-card" data-channel-card>
                <div class="channel-card-header">
                    <h2 data-channel-number>Channel</h2>

                    <div class="channel-card-actions">
                        <button
                            class="channel-order-button"
                            type="button"
                            data-move-channel-up
                            aria-label="Move channel up"
                        >
                            ↑ Up
                        </button>

                        <button
                            class="channel-order-button"
                            type="button"
                            data-move-channel-down
                            aria-label="Move channel down"
                        >
                            ↓ Down
                        </button>

                        <button
                            class="channel-order-button"
                            type="button"
                            data-duplicate-channel
                            aria-label="Duplicate channel"
                        >
                            Duplicate
                        </button>

                        <button
                            class="remove-channel"
                            type="button"
                            data-remove-channel
                        >
                            Remove
                        </button>
                    </div>
                </div>

                <div class="form-grid">
                    <label class="form-field">
                        <span>Channel name</span>
                        <input
                            data-field="name"
                            type="text"
                            maxlength="32"
                            placeholder="Example: TEST RPT"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Mode</span>
                        <select data-field="mode">
                            <option value="FM">FM</option>
                            <option value="NFM">NFM</option>
                            <option value="AM">AM</option>
                        </select>
                    </label>

                    <label class="form-field">
                        <span>Receive frequency (MHz)</span>
                        <input
                            data-field="receive_frequency_mhz"
                            type="number"
                            min="0.000001"
                            step="0.000001"
                            placeholder="146.940000"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Transmit frequency (MHz)</span>
                        <input
                            data-field="transmit_frequency_mhz"
                            type="number"
                            min="0.000001"
                            step="0.000001"
                            placeholder="146.340000"
                        >
                    </label>

                    <label class="form-field">
                        <span>Power (watts)</span>
                        <input
                            data-field="power_watts"
                            type="number"
                            min="0.1"
                            step="0.1"
                            value="5.0"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Tuning step (kHz)</span>
                        <select data-field="tuning_step_khz">
                            <option value="1">1.00</option>
                            <option value="2.5">2.50</option>
                            <option value="5" selected>5.00</option>
                            <option value="6.25">6.25</option>
                            <option value="9">9.00</option>
                            <option value="10">10.00</option>
                            <option value="12.5">12.50</option>
                            <option value="15">15.00</option>
                            <option value="20">20.00</option>
                            <option value="25">25.00</option>
                            <option value="30">30.00</option>
                            <option value="50">50.00</option>
                            <option value="100">100.00</option>
                            <option value="125">125.00</option>
                            <option value="200">200.00</option>
                        </select>
                    </label>

                    <label class="form-field">
                        <span>Scan behavior</span>
                        <select data-field="scan_behavior">
                            <option value="">
                                Normal scan
                            </option>
                            <option value="S">
                                Skip during scan
                            </option>
                            <option value="P">
                                Priority scan
                            </option>
                        </select>
                    </label>

                    <label class="form-field">
                        <span>Tone configuration</span>
                        <select data-field="tone_mode">
                            <option value="none">
                                No tone
                            </option>
                            <option value="tone">
                                Transmit CTCSS tone
                            </option>
                            <option value="tsql">
                                CTCSS tone squelch
                            </option>
                            <option value="dtcs">
                                Matched DCS / DTCS
                            </option>
                            <option value="cross">
                                Advanced / Cross tone
                            </option>
                        </select>
                    </label>

                    <div
                        class="form-field"
                        data-quick-ctcss-settings
                        hidden
                    >
                        <label>
                            <span>CTCSS frequency (Hz)</span>
                            <select
                                data-field="tone_frequency_hz"
                                data-ctcss-select
                            ></select>
                        </label>
                    </div>

                    <div
                        class="form-field"
                        data-quick-dcs-settings
                        hidden
                    >
                        <label>
                            <span>DCS code</span>
                            <select
                                data-field="dcs_code"
                                data-dcs-select
                            ></select>
                        </label>
                    </div>

                    <div
                        class="form-field"
                        data-quick-dcs-settings
                        hidden
                    >
                        <label>
                            <span>DCS polarity</span>
                            <select data-field="dcs_polarity">
                                <option value="NN">
                                    Normal / Normal
                                </option>
                                <option value="NR">
                                    Normal / Reverse
                                </option>
                                <option value="RN">
                                    Reverse / Normal
                                </option>
                                <option value="RR">
                                    Reverse / Reverse
                                </option>
                            </select>
                        </label>
                    </div>

                    <fieldset
                        class="advanced-tone-settings form-field-wide"
                        data-cross-tone-settings
                        hidden
                    >
                        <legend>Advanced tone controls</legend>

                        <div class="form-grid">
                            <label class="form-field">
                                <span>Transmit tone type</span>
                                <select
                                    data-field="transmit_tone_mode"
                                >
                                    <option value="none">
                                        No transmit tone
                                    </option>
                                    <option value="ctcss">
                                        CTCSS
                                    </option>
                                    <option value="dcs">
                                        DCS / DTCS
                                    </option>
                                </select>
                            </label>

                            <label class="form-field">
                                <span>Receive tone type</span>
                                <select
                                    data-field="receive_tone_mode"
                                >
                                    <option value="none">
                                        No receive tone
                                    </option>
                                    <option value="ctcss">
                                        CTCSS
                                    </option>
                                    <option value="dcs">
                                        DCS / DTCS
                                    </option>
                                </select>
                            </label>

                            <div
                                class="form-field"
                                data-transmit-ctcss-settings
                                hidden
                            >
                                <label>
                                    <span>
                                        Transmit CTCSS frequency
                                    </span>
                                    <select
                                        data-field="transmit_ctcss_frequency_hz"
                                        data-ctcss-select
                                    ></select>
                                </label>
                            </div>

                            <div
                                class="form-field"
                                data-receive-ctcss-settings
                                hidden
                            >
                                <label>
                                    <span>
                                        Receive CTCSS frequency
                                    </span>
                                    <select
                                        data-field="receive_ctcss_frequency_hz"
                                        data-ctcss-select
                                    ></select>
                                </label>
                            </div>

                            <div
                                class="form-field"
                                data-transmit-dcs-settings
                                hidden
                            >
                                <label>
                                    <span>Transmit DCS code</span>
                                    <select
                                        data-field="transmit_dcs_code"
                                        data-dcs-select
                                    ></select>
                                </label>
                            </div>

                            <div
                                class="form-field"
                                data-transmit-dcs-settings
                                hidden
                            >
                                <label>
                                    <span>Transmit DCS polarity</span>
                                    <select
                                        data-field="transmit_dcs_polarity"
                                    >
                                        <option value="N">
                                            Normal
                                        </option>
                                        <option value="R">
                                            Reverse
                                        </option>
                                    </select>
                                </label>
                            </div>

                            <div
                                class="form-field"
                                data-receive-dcs-settings
                                hidden
                            >
                                <label>
                                    <span>Receive DCS code</span>
                                    <select
                                        data-field="receive_dcs_code"
                                        data-dcs-select
                                    ></select>
                                </label>
                            </div>

                            <div
                                class="form-field"
                                data-receive-dcs-settings
                                hidden
                            >
                                <label>
                                    <span>Receive DCS polarity</span>
                                    <select
                                        data-field="receive_dcs_polarity"
                                    >
                                        <option value="N">
                                            Normal
                                        </option>
                                        <option value="R">
                                            Reverse
                                        </option>
                                    </select>
                                </label>
                            </div>
                        </div>
                    </fieldset>

                    <label class="form-field form-field-wide">
                        <span>Comment</span>
                        <input
                            data-field="comment"
                            type="text"
                            maxlength="120"
                            placeholder="Optional description"
                        >
                    </label>

                    <label class="checkbox-field form-field-wide">
                        <input
                            data-field="receive_only"
                            type="checkbox"
                        >
                        <span>
                            Receive only — disable transmitting on this
                            channel
                        </span>
                    </label>
                </div>
            </article>
        </template>
    </main>
</body>
</html>
