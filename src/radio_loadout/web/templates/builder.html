<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Build a custom multi-channel radio loadout and export it for CHIRP."
    >

    <title>Channel Builder | Radio Loadout</title>

    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/builder.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-mark">RL</span>
            <span>Radio Loadout</span>
        </a>

        <span class="version">Early Development</span>
    </header>

    <main>
        <section class="builder-heading">
            <p class="eyebrow">Multi-channel builder</p>
            <h1>Build your radio loadout.</h1>

            <p class="hero-description">
                Add as many channels as you need, arrange their radio
                settings, and export the complete loadout as one
                CHIRP-compatible CSV file.
            </p>
        </section>

        <form
            id="channel-form"
            class="builder-form"
            action="/downloads/chirp.csv"
            method="post"
        >
            <input
                id="channels-json"
                name="channels_json"
                type="hidden"
            >

            <div id="channel-list" class="channel-list"></div>

            <div class="builder-actions">
                <button
                    id="add-channel"
                    class="button button-secondary"
                    type="button"
                >
                    + Add another channel
                </button>

                <button
                    class="button button-primary"
                    type="submit"
                >
                    Generate CHIRP CSV
                </button>
            </div>
        </form>

        <template id="channel-template">
            <article
                class="channel-card"
                data-channel-card
            >
                <div class="channel-card-header">
                    <h2 data-channel-number>Channel</h2>

                    <button
                        class="remove-channel"
                        type="button"
                        data-remove-channel
                    >
                        Remove
                    </button>
                </div>

                <div class="form-grid">
                    <label class="form-field">
                        <span>Channel name</span>
                        <input
                            data-field="name"
                            type="text"
                            maxlength="32"
                            placeholder="Example: TEST RPT"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Mode</span>
                        <select data-field="mode">
                            <option value="FM">FM</option>
                            <option value="NFM">NFM</option>
                            <option value="AM">AM</option>
                        </select>
                    </label>

                    <label class="form-field">
                        <span>Receive frequency (MHz)</span>
                        <input
                            data-field="receive_frequency_mhz"
                            type="number"
                            min="0.000001"
                            step="0.000001"
                            placeholder="146.940000"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Transmit frequency (MHz)</span>
                        <input
                            data-field="transmit_frequency_mhz"
                            type="number"
                            min="0.000001"
                            step="0.000001"
                            placeholder="146.340000"
                        >
                    </label>

                    <label class="form-field">
                        <span>Power (watts)</span>
                        <input
                            data-field="power_watts"
                            type="number"
                            min="0.1"
                            step="0.1"
                            value="5.0"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Tone mode</span>
                        <select data-field="tone_mode">
                            <option value="none">
                                No tone
                            </option>
                            <option value="tone">
                                Transmit CTCSS tone
                            </option>
                            <option value="tsql">
                                CTCSS tone squelch
                            </option>
                            <option value="dtcs">
                                DCS / DTCS
                            </option>
                        </select>
                    </label>

                    <label
                        class="form-field"
                        data-ctcss-field
                    >
                        <span>CTCSS frequency (Hz)</span>
                        <select
                            data-field="tone_frequency_hz"
                            disabled
                        >
                            <option value="">
                                Select a CTCSS tone
                            </option>
                            <option value="67.0">67.0</option>

                        </select>
                    </label>

                            <option value="754">754</option>
                        </select>
                    </label>

                    <label class="form-field form-field-wide">
                        <span>Comment</span>
                        <input
                            data-field="comment"
                            type="text"
                            maxlength="120"
                            placeholder="Optional description"
                        >
                    </label>

                    <label
                        class="checkbox-field form-field-wide"
                    >
                        <input
                            data-field="receive_only"
                            type="checkbox"
                        >
                        <span>
                            Receive only — disable transmitting
                            on this channel
                        </span>
                    </label>
                </div>
            </article>
        </template>
    </main>
</body>
</html>
