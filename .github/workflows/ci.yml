name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Python tests
        run: python -m pytest

  javascript:
    name: JavaScript (Node.js 24 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Browser JavaScript syntax
        run: |
          node --check src/radio_loadout/web/static/backup-format.js
          node --check src/radio_loadout/web/static/builder.js
      - name: JavaScript tests
        run: node --test tests/js/*.mjs

  packaging:
    name: Installed package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development and build tools
        run: python -m pip install -e ".[dev]"
      - name: Build, inspect and smoke-test the installed wheel
        run: python scripts/smoke_package.py
      - name: Upload package artifacts and diagnostic logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-python-${{ matrix.python-version }}
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  container:
    name: Staging container (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python smoke driver
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Build the local staging image
        run: docker build --platform linux/amd64 --tag radio-loadout:staging-ci .
      - name: Run with restricted privileges and temporary storage
        run: |
          docker run --detach --name radio-loadout-staging-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128 \
            --publish 127.0.0.1:8000:8000 radio-loadout:staging-ci
      - name: Verify non-root runtime and absence of development tools
        run: |
          docker exec radio-loadout-staging-ci python -c "import os,importlib.util; assert os.getuid() == 10001; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('build') is None; assert not os.path.exists('/build')"
      - name: Smoke-test health, assets, CSV workflows and limits
        run: python scripts/staging_smoke.py --base-url http://127.0.0.1:8000
      - name: Stop the local test container
        if: ${{ always() }}
        run: docker rm --force radio-loadout-staging-ci

  browser:
    name: Browser journeys (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install project and browser-test dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: npm run check:syntax
      - name: Browser journeys and accessibility checks
        run: npm run test:e2e
      - name: Upload synthetic browser-test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chromium-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
