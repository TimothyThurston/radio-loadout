[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-loadout"
version = "0.1.0"
description = "Universal radio channel planning and configuration exporter for CHIRP, DMR codeplugs, and manufacturer programming software."
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE", "COPYRIGHT"]
requires-python = ">=3.11"
authors = [
    { name = "Timothy Thurston" }
]
dependencies = [
    "fastapi[standard]",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest",
    "ruff",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["radio_loadout", "radio_loadout.*"]
namespaces = false

[tool.setuptools.package-data]
radio_loadout = [
    "third_party_notices/v1/*.json",
    "third_party_notices/v1/*.md",
    "third_party_notices/v1/*/*.txt",
    "web/static/*.css",
    "web/static/*.js",
    "web/static/*.json",
    "web/templates/*.html",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
